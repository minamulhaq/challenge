name: Unit Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (Local Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Loads the image into the local Docker daemon for 'docker run'
          tags: esp_challenge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/challenge" \
            -w /challenge/part3_unit_tests \
            esp_challenge:latest \
            /bin/bash run.sh
